name: deepseek-search
version: 0.1.0
description: Direct access to DeepSeek's native Search and Fetch APIs for live web data with query operators, relevance scoring, and full-page Markdown retrieval.
hermes_requires: ">=0.21"
author: sentenza
license: MIT
env_requires:
  - name: DEEPSEEK_API_KEY
    description: DeepSeek platform API key (not OpenRouter). Read from the environment only; never commit it.
    required: true
distribution_owned:
  - SKILL.md
  - distribution.yaml
  - scripts
  - references
  - evals