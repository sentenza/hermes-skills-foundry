name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.x'

      - name: Run validation gate
        run: python3 scripts/validate.py

      - name: Install test dependencies
        run: python3 -m pip install --upgrade requests

      - name: Run skill script tests
        run: python3 -m unittest discover -s tests

      - name: Check if validate.py changed
        id: validate_changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^scripts/(test_)?validate\.py$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run validate.py unit tests
        if: steps.validate_changed.outputs.changed == 'true'
        run: python3 scripts/test_validate.py
